name: 'Java Metrics Gate'
description: 'Diff-aware Java code metrics quality gate. Fails only on what this pull request made worse.'
author: 'b333vv'

inputs:
  base:
    description: 'Base git reference to compare against. Defaults to origin/main; for pull requests GitHub sets GITHUB_BASE_REF, which is used as origin/<base>.'
    required: false
    default: ''
  tool-version:
    description: 'Version of the released CLI to download. Ignored when cli-path is set.'
    required: false
    default: 'latest'
  cli-path:
    description: 'Path to an already-present java-metrics-cli executable. Use for an offline or air-gapped runner, and for a locally built distribution. Nothing is downloaded when this is set.'
    required: false
    default: ''
  checksum:
    description: 'Expected SHA-256 of the distribution archive. When set, the download is verified against it. When not set, the checksum published beside the archive in the release is used instead, so the download is still verified; pass this input to pin an archive the workflow already trusts.'
    required: false
    default: ''
  config:
    description: 'Path to .metrics-gate.yml project configuration file'
    required: false
    default: ''
  policy:
    description: 'Policy deciding the verdict: legacy (default) uses thresholds; maintainability uses the versioned rule catalogue'
    required: false
    default: ''
  enforcement:
    description: 'For --policy maintainability: advisory (default) reports findings without failing; enforce blocks on them'
    required: false
    default: ''
  profile:
    description: 'Threshold profile name to use (e.g. strict, standard, relaxed)'
    required: false
    default: ''
  thresholds:
    description: 'Path to explicit thresholds JSON/YAML file'
    required: false
    default: ''
  exclude-file:
    description: 'Path to exclusion rules file'
    required: false
    default: ''
  report-format:
    description: 'Report format: json, html or agent-md. The findings JSON is always produced as well, because the counts come from it.'
    required: false
    default: 'json'
  report-path:
    description: 'Path where the gate report file should be saved'
    required: false
    default: 'metrics-gate-report.json'
  artifact-name:
    description: 'Name of the uploaded report artifact. Set it when this action runs more than once in a job: two invocations cannot share one artifact name, and the second upload fails with a 409 conflict rather than replacing the first.'
    required: false
    default: 'metrics-gate-report'

outputs:
  status:
    description: 'Gate status: PASSED, FAILED, INCOMPLETE or ERROR'
    value: ${{ steps.run-gate.outputs.status }}
  exit-code:
    description: 'The tool''s own exit code: 0 passed, 1 failed, 2 incomplete or a usage error'
    value: ${{ steps.run-gate.outputs.exit-code }}
  blocking-count:
    description: 'Findings eligible to block the build'
    value: ${{ steps.run-gate.outputs.blocking-count }}
  total-count:
    description: 'Total findings, whatever their disposition'
    value: ${{ steps.run-gate.outputs.total-count }}
  findings-count:
    description: 'Total findings, whatever their disposition. Alias of total-count.'
    value: ${{ steps.run-gate.outputs.findings-count }}
  violations-count:
    description: 'Findings eligible to block the build. Alias of blocking-count.'
    value: ${{ steps.run-gate.outputs.violations-count }}
  entities:
    description: 'Entities carrying at least one finding'
    value: ${{ steps.run-gate.outputs.entities }}
  issues:
    description: 'Evaluation issues: checks that could not be run'
    value: ${{ steps.run-gate.outputs.issues }}
  completeness:
    description: 'How much of the tree the analysis actually read: complete, partial, none, or unknown. Not complete means a low count describes only the part that was read.'
    value: ${{ steps.run-gate.outputs.completeness }}
  tool-version:
    description: 'The CLI version that produced the report'
    value: ${{ steps.run-gate.outputs.tool-version }}
  report-path:
    description: 'Path to the generated gate report'
    value: ${{ steps.run-gate.outputs.report-path }}
  findings-path:
    description: 'Path to the findings JSON, the document the counts come from'
    value: ${{ steps.run-gate.outputs.findings-path }}

runs:
  using: 'composite'
  steps:
    # ------------------------------------------------------------------ the tool
    #
    # Two ways in, and only two: a verified download of a release, or a path the caller already has.
    # There is deliberately no "build the CLI from this action's checkout" fallback: an action that
    # falls back to running Gradle in the *consumer's* repository builds their project with a tool
    # they never asked for, fails on a Gradle they may not have, and writes into their source tree.

    - name: Resolve the CLI
      id: cli
      shell: bash
      env:
        INPUT_CLI_PATH: ${{ inputs.cli-path }}
        INPUT_TOOL_VERSION: ${{ inputs.tool-version }}
        INPUT_CHECKSUM: ${{ inputs.checksum }}
        # The repository releases are read from. It was referenced by the download step and never
        # defined, so with `set -u` that step failed on an unbound variable for every consumer
        # that did not already have a CLI on the runner.
        MG_REPO: ${{ github.repository }}
        GITHUB_OUTPUT: ${{ github.output }}
      run: |
        set -euo pipefail
        work="$RUNNER_TEMP/metricstree-cli"

        if [ -n "$INPUT_CLI_PATH" ]; then
          echo "CLI probe: path='$INPUT_CLI_PATH'" >&2
          echo "CLI probe: exists=$([ -e "$INPUT_CLI_PATH" ] && echo yes || echo no)" >&2
          if [ ! -e "$INPUT_CLI_PATH" ]; then
            echo "Error: cli-path does not exist: '$INPUT_CLI_PATH'" >&2
            echo "Point it at a java-metrics-cli launcher or at a self-contained jar's java." >&2
            exit 2
          fi
          echo "CLI probe: executable=$([ -x "$INPUT_CLI_PATH" ] && echo yes || echo no)" >&2
          if [ ! -x "$INPUT_CLI_PATH" ]; then
            echo "The CLI launcher has no executable bit; attempting to restore it." >&2
            if ! chmod +x "$INPUT_CLI_PATH" 2>/dev/null; then
              echo "Error: cli-path was set to '$INPUT_CLI_PATH', which is not an executable file." >&2
              echo "Point it at a java-metrics-cli launcher or at a self-contained jar's java." >&2
              exit 2
            fi
          fi
          echo "CLI probe: executable-after=$([ -x "$INPUT_CLI_PATH" ] && echo yes || echo no)" >&2
          echo "Using the CLI supplied by the workflow at $INPUT_CLI_PATH"
          echo "cli-path=$INPUT_CLI_PATH" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # A clean directory before anything is written into it.
        #
        # This cleanup used to run *after* the download and the checksum verification, which broke
        # the download path in two ways depending on where it ran. On a runner the directory does not
        # exist yet, so the `curl -o` could not write the archive and the step exited 2 for want of a
        # directory, never reaching the cleanup at all. Where the directory did exist, the download
        # and the checksum both succeeded and then `rm -rf` deleted the verified archive before
        # `unzip` was handed it, which exits 9. Neither failure named the cleanup. Nothing caught it
        # because nothing ran it: every earlier consumer run passed `cli-path`, which returns from
        # this step before the download is reached. Clearing first also stops a second run on the
        # same runner from unpacking over a previous release's files.
        #
        # It sits above the archive and the checksum, which are written here, and above the release
        # lookup, which is not: clearing unconditionally keeps this step's only side effect in one
        # place whichever branch is taken.
        rm -rf "$work"
        mkdir -p "$work"

        # Fetching, retried.
        #
        # One attempt is what the hosted consumer run had, and a single transient receive error
        # turned its macOS job red for a reason nobody could act on: curl exit 56, on a request that
        # had answered minutes earlier on the same commit.
        #
        # A loop here rather than curl's own `--retry`, for the reason the gate itself is a script:
        # nothing in this repository can observe a retry that happens inside the real curl. The tests
        # execute this step with a stubbed curl, and a stub cannot emulate the retrying of the binary
        # it replaces, so `--retry` would be a behaviour only a hosted run could confirm.
        #
        # 22 is curl's "the server answered with an error status" -- a 404 for a version that does
        # not exist, most of the time. That is not transient, so it is reported at once rather than
        # repeated three times; anything else is a transport failure, which is what a second attempt
        # can survive.
        fetch() {
          url="$1"
          destination="$2"
          shift 2
          attempt=1
          while true; do
            status=0
            curl -fsSL "$@" "$url" -o "$destination" || status=$?
            if [ "$status" -eq 0 ]; then
              return 0
            fi
            if [ "$status" -eq 22 ] || [ "$attempt" -ge 3 ]; then
              return 1
            fi
            echo "Attempt $attempt to fetch $url failed (curl exit $status); retrying" >&2
            attempt=$((attempt + 1))
            sleep 2
          done
        }

        # Where GitHub sends a request for "the latest release", retried on the same terms as
        # `fetch` and for the same reason. The answer is a URL rather than a document, so it arrives
        # on stdout and cannot go through `fetch`; the loop is otherwise the same shape.
        #
        # The `|| status=$?` is load-bearing. Without it, a curl that failed inside a command
        # substitution ends the script with curl's own exit status under `set -o pipefail`, and the
        # message the caller below would print is never reached. That shape of bug is what the
        # hosted consumer run's macOS job reported as a bare `56` with nothing to act on.
        ask_latest() {
          attempt=1
          while true; do
            status=0
            destination=$(curl -fsS -o /dev/null -w '%{redirect_url}' "$latest_url") || status=$?
            if [ "$status" -eq 0 ]; then
              return 0
            fi
            if [ "$status" -eq 22 ] || [ "$attempt" -ge 3 ]; then
              return 1
            fi
            echo "Attempt $attempt to ask $latest_url failed (curl exit $status); retrying" >&2
            attempt=$((attempt + 1))
            sleep 2
          done
        }

        # The tag and the version are two different strings, and the asset is named after the
        # second: the tag is `v2026.1.0`, the archive is `metricstree-cli-2026.1.0.zip`.
        #
        # `latest` is a request rather than a version -- no release is named `latest`. This step
        # used to fall through to an asset called `metricstree-cli.zip`, which no release has
        # ever published, so the default value of tool-version could not work. The tag is now
        # resolved and then used whole, so the archive named after it is the one actually there.
        #
        # It is resolved from GitHub's own redirect, not from the releases API.
        #
        # The API call this replaces was unauthenticated, and an unauthenticated limit is per IP
        # address while hosted runners share theirs. The consumer workflow's own release probe
        # authenticates for exactly this reason and says so; this step did not. The hosted consumer
        # run's macOS job then failed on the download path on two consecutive commits while the
        # same commits' Linux jobs downloaded the same release without trouble, and a request that
        # is refused by address is the one difference this step can remove.
        #
        # `https://github.com/OWNER/REPO/releases/latest` answers 302 to `.../releases/tag/<tag>`.
        # That is the same question with no credential, no API quota and no per-address limit --
        # and it is asked of the host the archive is fetched from, so a runner that could download
        # the release at all can establish which release to download. A repository with no
        # published release lands on `.../releases` instead, which is how "there is nothing to
        # resolve" is told apart from "the question could not be asked": the two end this step
        # with different messages rather than one shared "could not determine the latest release".
        #
        # The redirect is read from `%{redirect_url}` on a request that does not follow it, so the
        # lookup is one small request and no page body. The answer is parsed with parameter
        # expansion rather than by piping it through `sed`: a tag is the last path segment of the
        # destination, and a pipeline here would be a second place for the failure above to hide.
        tag="$INPUT_TOOL_VERSION"
        if [ "$tag" = "latest" ]; then
          latest_url="https://github.com/$MG_REPO/releases/latest"
          destination=""
          if ! ask_latest; then
            echo "Error: could not ask $latest_url which release is the latest one." >&2
            echo "The request did not complete, so nothing was analysed." >&2
            echo "Pin a version explicitly with the tool-version input." >&2
            exit 2
          fi
          case "$destination" in
            */releases/tag/*) tag="${destination##*/releases/tag/}" ;;
            *) tag="" ;;
          esac
          if [ -z "$tag" ]; then
            echo "Error: $MG_REPO named no latest release." >&2
            echo "The request was answered with '$destination', which is not a release page." >&2
            echo "Pin a version explicitly with the tool-version input." >&2
            exit 2
          fi
          echo "Latest release: $tag"
        fi
        case "$tag" in
          v*) version="${tag#v}" ;;
          *)  version="$tag"; tag="v$tag" ;;
        esac

        asset="metricstree-cli-$version.zip"
        base="https://github.com/$MG_REPO/releases/download/$tag"
        archive="$work/$asset"

        echo "Downloading $base/$asset"
        if ! fetch "$base/$asset" "$archive"; then
          echo "Error: could not download $base/$asset" >&2
          echo "Nothing was analysed." >&2
          exit 2
        fi

        # The archive is verified before it is unpacked and long before anything is analysed.
        #
        # An explicit checksum input is the strongest statement available: it pins an archive the
        # workflow already trusts, and it is the only option for a release with no published
        # checksum. When none is given, the checksum published beside the archive is used instead,
        # which is what a package registry does and what makes `latest` safe to resolve: it
        # detects a corrupted or substituted download, which is the threat a checksum covers. It
        # does not defend against an attacker who can rewrite the release itself -- that needs
        # the explicit input, and the comment says so rather than implying more.
        expected="$INPUT_CHECKSUM"
        if [ -n "$expected" ]; then
          echo "Verifying against the checksum supplied to the action"
        else
          checksum_file="$work/$asset.sha256"
          if ! fetch "$base/$asset.sha256" "$checksum_file"; then
            echo "Error: the release $tag has no $asset.sha256 beside the archive." >&2
            echo "Nothing was analysed. Pass the expected SHA-256 as the checksum input." >&2
            exit 2
          fi
          expected=$(awk '{print $1; exit}' "$checksum_file")
          echo "Verifying against the checksum published with the release"
        fi
        if [ -z "$expected" ]; then
          echo "Error: no expected checksum could be determined, so the download is unverified." >&2
          echo "Nothing was analysed." >&2
          exit 2
        fi
        actual=$(shasum -a 256 "$archive" | cut -d' ' -f1)
        if [ "$actual" != "$expected" ]; then
          echo "Error: the downloaded archive does not match the expected checksum." >&2
          echo "  expected $expected" >&2
          echo "  actual   $actual" >&2
          echo "Nothing was analysed." >&2
          exit 2
        fi
        echo "Checksum verified"

        unzip -q "$archive" -d "$work"
        launcher="$work/metricstree-cli/bin/java-metrics-cli"
        if [ ! -x "$launcher" ]; then
          echo "Error: the archive did not contain the expected launcher." >&2
          exit 2
        fi
        echo "cli-path=$launcher" >> "$GITHUB_OUTPUT"

    # ------------------------------------------------------------------ the gate

    - name: Run the metrics gate
      id: run-gate
      shell: bash
      env:
        # Every input crosses into the script as an environment variable. None is interpolated into
        # the script's source text, so a branch name or a path containing a quote, a semicolon or a
        # command substitution is a string and never code.
        MG_CLI: ${{ steps.cli.outputs.cli-path }}
        MG_BASE_OVERRIDE: ${{ inputs.base }}
        MG_REPORT: ${{ inputs.report-path }}
        MG_FINDINGS: ${{ runner.temp }}/metrics-findings.json
        MG_FORMAT: ${{ inputs.report-format }}
        MG_MODE: committed
        MG_CONFIG: ${{ inputs.config }}
        MG_PROFILE: ${{ inputs.profile }}
        MG_THRESHOLDS: ${{ inputs.thresholds }}
        MG_EXCLUDE_FILE: ${{ inputs.exclude-file }}
        MG_POLICY: ${{ inputs.policy }}
        MG_ENFORCEMENT: ${{ inputs.enforcement }}
        # Both of these are the runner's, not the action's, and the lines cannot change where the
        # script writes: the runner creates one file per step and exposes its path as
        # github.output / github.step_summary, and ScriptHandler copies the github context into the
        # step environment *after* merging this block, so its value wins. They are written to say
        # which file each name must point at, because the wrong expression here is invisible --
        # `${{ steps.run-gate.outputs }}` names this step's own outputs object, which is empty at
        # the moment this block is evaluated, and only the overwrite keeps that from mattering.
        GITHUB_OUTPUT: ${{ github.output }}
        GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
      run: |
        "${{ github.action_path }}/scripts/run-metrics-gate-action.sh"

    # ------------------------------------------------------------------ the evidence

    - name: Stage the reports
      id: stage-reports
      if: always()
      shell: bash
      env:
        INPUT_REPORT_PATH: ${{ inputs.report-path }}
      run: |
        # Uploaded on every outcome, not only on failure. A run that reported INCOMPLETE and left no
        # evidence is the case where a person most needs to see what was actually checked.
        #
        # The directory is cleared before anything is staged into it, and before the "nothing to
        # stage" return below. It is one fixed path under $RUNNER_TEMP, so a job that invokes this
        # action twice stages into the same place twice -- and the second invocation then uploaded
        # the first invocation's report under its own artifact name. The hosted consumer run showed
        # it as a size before anyone read it as a bug: its second artifact was 4.2 KB where the first
        # was 2.8 KB, which is one report from each run rather than two from one. Clearing first is
        # also what makes the return below true. An invocation that produced no report must publish
        # an empty artifact; leaving the previous invocation's evidence behind would have it
        # published under a name that claims it is this run's.
        : "${RUNNER_TEMP:?RUNNER_TEMP must be set; this step clears and recreates a directory under it}"
        rm -rf "$RUNNER_TEMP/metrics-gate-reports"
        mkdir -p "$RUNNER_TEMP/metrics-gate-reports"
        # Spelled as the environment variable rather than as `runner.temp` so that this block is
        # valid shell: the tests execute it, and an expression the runner expands first is not shell.
        # The two name the same directory.
        reports=""
        [ -f "$INPUT_REPORT_PATH" ] && reports="$reports $INPUT_REPORT_PATH"
        [ -f "$RUNNER_TEMP/metrics-findings.json" ] && \
          reports="$reports $RUNNER_TEMP/metrics-findings.json"
        if [ -z "$reports" ]; then
          echo "No report was produced; there is nothing to upload." >&2
          exit 0
        fi
        for report in $reports; do
          cp "$report" "$RUNNER_TEMP/metrics-gate-reports/$(basename "$report")"
        done
        echo "Reports collected:"
        ls -1 "$RUNNER_TEMP/metrics-gate-reports"

    - name: Upload the reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        # Named by input rather than fixed. Artifact names are unique within a run, so a job that
        # invokes this action twice -- two report paths, two fixtures, one of each policy -- failed
        # on the second upload with a 409 conflict, after the gate had already run and published
        # its verdict. The default keeps the name consumers already expect.
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/metrics-gate-reports/
        if-no-files-found: warn
