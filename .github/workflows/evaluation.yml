# The evaluation harness's own tests.
#
# A separate job because `./gradlew check` does not run Python, and a harness whose tests only ran
# when somebody remembered would rot. It uses the bundled cases only: no corpus is downloaded and no
# competitor binary is fetched, so the job is reproducible and cannot be broken by a network.
name: evaluation

on:
  push:
    paths:
      - 'evaluation/**'
      - '.github/workflows/evaluation.yml'
  pull_request:
    paths:
      - 'evaluation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-tests:
    name: Evaluation harness tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Run the harness tests
        # Standard library only, and no Java build required: a missing binary, a failed run and a
        # malformed report are properties of the driver, and it has to get those right before any
        # number it prints can be believed.
        run: python3 -m unittest discover -s evaluation/tests -p 'test_*.py' -v

      - name: Validate the bundled corpus and labels
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("evaluation").resolve()))
          import importlib.util
          spec = importlib.util.spec_from_file_location("run", "evaluation/run.py")
          module = importlib.util.module_from_spec(spec)
          sys.modules["run"] = module
          spec.loader.exec_module(module)
          cases = module.load_cases(Path("evaluation/cases"))
          labels = module.load_labels(Path("evaluation/labels"))
          print(f"corpus: {len(cases)} cases, {len(labels)} label files")
          missing = {case["id"] for case in cases} - set(labels)
          # Not an error: an unlabelled case is simply excluded from the rates, and the summary
          # says how many. It is printed so the count is never a surprise in a result.
          print(f"unlabelled cases (excluded from rates): {sorted(missing)}")
          PY

  dry-run:
    name: Dry run against the packaged CLI
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the CLI
        run: ./gradlew :java-metrics-cli:installDist -q

      - name: Run the corpus
        run: |
          python3 evaluation/run.py \
            --cli java-metrics-cli/build/install/java-metrics-cli/bin/java-metrics-cli \
            --out evaluation/results/run.json
          python3 evaluation/summarize.py \
            --run evaluation/results/run.json \
            --out evaluation/results/summary.json

      - name: Show the summary
        run: cat evaluation/results/summary.json

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evaluation-results
          path: evaluation/results/
          if-no-files-found: warn
