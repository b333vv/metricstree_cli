# Builds the ready-to-run artifacts for a release tag and attaches them with their checksums.
#
# This workflow builds and uploads. It does not create tags and it does not publish to a package
# registry: a release is a decision someone makes, and a workflow that could trigger itself on its
# own output would make that decision for them.
name: release

on:
  push:
    # Tag only. A workflow that ran on every main commit would build artifacts nobody asked for and
    # train everyone to ignore the notifications.
    tags:
      - 'v*'

permissions:
  contents: read

env:
  # The leading `v` is a git convention, not part of the version: `v2026.1.0` stamps 2026.1.0.
  # Left in, every artifact would answer `v2026.1.0` to --version while every release note, POM
  # and lock file says 2026.1.0.
  #
  # Workflow level, because a job that forgot its own copy would build the right thing under the
  # wrong version -- which is the exact defect this variable exists to remove.
  VERSION: ${{ github.ref_name }}

jobs:
  # Two jobs with two different jobs to do, on purpose. This one proves the tag builds and passes
  # everywhere it claims to; `package` below produces the artifact that is actually published.
  #
  # The earlier single matrix job did both, and merging its artifacts published exactly one archive.
  # All four builds wrote the same filename -- the archive carries a version but no OS -- and
  # `merge-multiple: true` collapsed them into one directory, so three builds' work was silently
  # overwritten by whichever finished last. Nothing failed: every path matched, so the release
  # looked complete and described one platform.
  verify:
    name: Verify on ${{ matrix.os }}, JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Declared rather than assumed. Every step below is written as bash (`set -eu`,
        # `${var#v}`), and an explicit `shell: bash` also turns on `-o pipefail`, which the
        # implicit default on Linux and macOS does not. Stating it keeps the requirement visible
        # instead of resting on the runner's default shell happening to agree.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Java 17 is the floor the tool supports, so 17 and 21 both have to work: a distribution
        # that only builds on the newest JDK is one that half its users cannot run. This matrix
        # exists to catch that, which is a question about building, not about which bytes to ship.
        #
        # macOS and Linux only. Windows was removed deliberately -- see DEBT-15 in
        # docs/tech-debt-tracker.md -- so this job proves the tag builds and passes everywhere the
        # project currently claims to support, and nowhere else.
        os: [ubuntu-latest, macos-latest]
        java: ['17', '21']

    steps:
      - name: Check out the repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Verify the build
        # `check` includes the distribution smoke tests, so a release is refused for the same
        # reasons a local build is: including for a minimize() regression that would break every
        # user's first run.
        #
        # metricsVersion comes from the tag, not from gradle.properties. The tag is what the user
        # downloaded and what the action resolves `tool-version` to, so a build that ignored it
        # would publish two different sources under one version string -- and `--version` would
        # answer for both.
        run: ./gradlew check -PmetricsVersion="${VERSION#v}"

  package:
    name: Build the distribution
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          # The floor, not the newest. The artifact is built once, on the oldest supported JDK, so
          # it runs on every JDK anyone has instead of only on the one that happened to build it.
          java-version: '17'

      - name: Build the distribution and its checksum
        run: ./gradlew :java-metrics-cli:distributionZip :java-metrics-cli:archiveChecksum -PmetricsVersion="${VERSION#v}"

      - name: Check what will be published
        # The names are the contract with the action, which addresses the assets by name and reads
        # the checksum beside them. Listing them here means a rename fails this job, loudly,
        # instead of failing later on someone else's runner as a 404.
        run: |
          set -eu
          ls -1 java-metrics-cli/build/distributions/
          ls -1 java-metrics-cli/build/dist-checksums/
          archive="java-metrics-cli/build/distributions/metricstree-cli-${VERSION#v}.zip"
          checksum="java-metrics-cli/build/dist-checksums/metricstree-cli-${VERSION#v}.zip.sha256"
          for expected in "$archive" "$checksum"; do
            if [ ! -f "$expected" ]; then
              echo "::error::Expected $expected, and it was not built. The action downloads assets by this name."
              exit 1
            fi
          done
          echo "The archive and the checksum that describes it will both be published."

      - name: Upload the artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metricstree-cli-distribution
          path: |
            java-metrics-cli/build/distributions/metricstree-cli-*.zip
            java-metrics-cli/build/dist-checksums/metricstree-cli-*.zip.sha256
          if-no-files-found: error

  publish:
    name: Attach assets to the release
    needs: package
    # Only after every matrix job passed: a release with one platform's artifacts missing is worse
    # than no release, because it looks complete.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - name: Download the artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: metricstree-cli-distribution
          path: artifacts

      - name: Publish
        # SHA verified against the upstream repository: c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda
        # is refs/tags/v2.2.1 of softprops/action-gh-release, and is the annotated tag object
        # rather than a guess at a commit. All four pins in this workflow are now verified.
        #
        # Upstream has since published v3.0.3. Moving to it is a separate decision: it is a major
        # bump, so the inputs and outputs it documents have to be read first rather than assumed
        # compatible with v2.
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: artifacts/**
          fail_on_unmatched_files: true
