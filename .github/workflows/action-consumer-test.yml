# The action, exercised the way a consumer runs it: in a repository that has nothing to do with
# this one, on a fixture built at run time.
#
# This is the test the local integration suite cannot be. Locally, `GitHubActionConsumerTest` runs
# the action's script against the CLI built here — which proves the logic, not the wiring. Only a
# hosted run can prove that the action resolves, downloads, verifies and runs in a repository that
# never heard of this project.
#
# It runs on a schedule and on workflow_dispatch as well as on changes to the action, so a
# regression in the runner environment is caught rather than discovered by a consumer.
#
# One step at the end downloads a real release instead of using a locally built CLI. That is the
# half the rest of the job cannot reach: `cli-path` short-circuits the action's download, so every
# step above proves the gate's logic and nothing about the wiring a consumer actually gets.
name: action-consumer-test

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: >-
          Release to download in the download-path step, e.g. v2026.3.0. Leave empty to use the
          latest published release.
        required: false
        type: string
  schedule:
    # Early on a Monday UTC: a weekly check that lands when someone is around to read it.
    - cron: '37 6 * * 1'
  push:
    paths:
      - 'action.yml'
      - 'scripts/**'
      - '.github/workflows/action-consumer-test.yml'

permissions:
  contents: read

env:
  # Names the release the download-path step should use. Empty means "whatever `latest` resolves
  # to", which is left to the action rather than decided here.
  RELEASE_VERSION: ${{ inputs.release-version }}

jobs:
  consumer:
    name: Action on a fixture consumer repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS and Linux only. Windows was dropped deliberately rather than because it passed:
        # see the DEBT-15 entry in docs/tech-debt-tracker.md. Nothing here is Unix-specific by
        # intent -- the exclusion is a statement about what this project currently supports and
        # verifies, not a claim that the action cannot run there.
        os: [ubuntu-latest, macos-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the action
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the CLI
        # Outside the workspace, because the fixture replaces the workspace below. Most of this job
        # runs against a locally built CLI, so it needs no published release to exist. The one step
        # that does is at the end, and it is the only one that reaches the download path -- the
        # comment here used to claim that path was "covered by the action's own step", which was
        # true of the step existing and false of it ever running.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cli"
          git clone -q . "$RUNNER_TEMP/cli/source"
          cd "$RUNNER_TEMP/cli/source"
          ./gradlew :java-metrics-cli:installDist -q
          # The launcher lands under the *module's* build directory. `:java-metrics-cli:installDist`
          # is a task of that subproject, so its output is java-metrics-cli/build/install/... and
          # never the root build/install. Addressing it without the module segment made this step
          # fail on every runner -- ubuntu and macOS included, not just Windows -- with
          # `find: .../build/install: No such file or directory`, so the workflow proved nothing
          # about the action on any platform while appearing to be a platform problem.
          launcher="$RUNNER_TEMP/cli/source/java-metrics-cli/build/install/java-metrics-cli/bin/java-metrics-cli"
          if [ ! -f "$launcher" ]; then
            echo "::error::installDist produced no launcher at $launcher"
            exit 1
          fi
          # A checkout on a runner does not always preserve the executable bit, and installDist
          # writes the launcher from Java rather than by copying it. Restore the bit explicitly so
          # the gate step can execute the binary directly.
          chmod +x "$launcher"

      - name: The checksum a release publishes is readable the way the action reads it
        # The action verifies a download against `<asset>.sha256` from the release, taking the
        # first field as the hash. That is a contract between the Gradle task and a shell script in
        # another repository, and nothing else checks it: the consumer run below passes cli-path and
        # never downloads. So the task runs here and is parsed exactly as the action parses it.
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cli/source"
          ./gradlew :java-metrics-cli:distributionZip :java-metrics-cli:archiveChecksum -q
          archives=$(ls java-metrics-cli/build/distributions/metricstree-cli-*.zip)
          # Exactly one archive, or the release publishes a collision and the comparison below
          # would silently read the first of several.
          count=$(printf '%s\n' "$archives" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected one distribution archive, found $count:"
            printf '%s\n' "$archives"
            exit 1
          fi
          name=$(basename "$archives")
          checksum="java-metrics-cli/build/dist-checksums/${name}.sha256"
          if [ ! -f "$checksum" ]; then
            echo "::error::Expected $checksum. The action downloads <asset>.sha256 by that exact name."
            exit 1
          fi
          expected=$(awk '{print $1; exit}' "$checksum")
          # Portable SHA-256: sha256sum (Linux) or shasum (macOS). Both runners in the matrix are
          # covered, and neither name is assumed to exist on the other platform.
          if command -v sha256sum >/dev/null 2>&1; then
              actual=$(sha256sum "$archives" | cut -d' ' -f1)
          else
              actual=$(shasum -a 256 "$archives" | cut -d' ' -f1)
          fi
          if [ "$expected" != "$actual" ]; then
            echo "::error::The published checksum does not describe the published archive."
            echo "  expected $expected"
            echo "  actual   $actual"
            exit 1
          fi
          echo "The action's first-field parse reads this checksum correctly: $expected"

      - name: Build a fixture consumer repository
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/consumer"
          remote="$RUNNER_TEMP/remote"
          mkdir -p "$remote" "$consumer"
          git init -q --bare "$remote"
          git init -q -b main "$consumer"
          git -C "$consumer" config user.email fixture@test
          git -C "$consumer" config user.name fixture
          git -C "$consumer" config commit.gpgsign false
          git -C "$consumer" remote add origin "$remote"
          mkdir -p "$consumer/src/main/java/app"

          # Writes src/main/java/app/Order.java with $1 branches in f(). The base revision gets a
          # method below the rule's threshold and the head revision one above it, so the only thing
          # the gate can see in the diff is the complexity the change added. This is the shape
          # GitHubActionConsumerTest.violationExit1HasNonzeroBlockingCount uses, and the hosted
          # fixture has to agree with it: the two are meant to test the same behaviour.
          write_order() {
            {
              echo 'package app;'
              echo 'public class Order {'
              echo '    public int f(int x) {'
              for i in $(seq 1 "$1"); do echo "        if (x == $i) return $i;"; done
              echo '        return 0;'
              echo '    }'
              echo '}'
            } > "$consumer/src/main/java/app/Order.java"
          }

          # The base revision: a method that does not violate, plus the config that makes a
          # violation fail the build. Every rule in the shipped catalogue is a warn candidate, so
          # `--enforcement enforce` on its own reports findings and exits 0; a consumer that wants
          # CI to fail has to opt the rule in, and this fixture is that consumer. Committed with the
          # base so the config is not itself part of the diff under test.
          write_order 2
          cat > "$consumer/.metrics-gate.yml" <<'YAML'
          gate:
            policy: maintainability
          maintainability:
            enabledRules: [MT-M001]
            rules:
              MT-M001:
                mode: error
          YAML
          git -C "$consumer" add -A
          git -C "$consumer" commit -q -m 'initial'
          git -C "$consumer" push -q -u origin main

          # The change under test, committed but not pushed: the shape of a pull request's head. It
          # makes the method complex, which is the one outcome the assertion below exists to see
          # reported. An earlier version of this fixture had it backwards -- a complex base and a
          # change that added a trivial class -- so the gate correctly reported PASSED and the
          # assertion failed on every run, on every platform.
          write_order 25
          git -C "$consumer" add -A
          git -C "$consumer" commit -q -m 'made it complex'

      # A composite action runs in the caller's working directory, so the fixture has to *be* that
      # directory. The step copies it over the checkout: `uses: ./` is resolved before this step
      # runs, and everything afterwards — including the action — reads the fixture.
      - name: Make the fixture the working repository
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/consumer"
          remote="$RUNNER_TEMP/remote"
          git -C "$consumer" config user.email fixture@test
          git -C "$consumer" config user.name fixture
          git -C "$consumer" config commit.gpgsign false
          # A pull request's head, already committed and not pushed.
          git -C "$consumer" checkout -q -b pr-head
          git -C "$consumer" config remote.origin.url "file://$remote"
          # A composite action is resolved by GitHub at workflow load time (before this step runs),
          # so `uses: ./` resolves against the checkout that still holds action.yml/scripts. This
          # step swaps the workspace contents for the fixture; afterward the action runs in the
          # caller's working directory and reads/writes the fixture — exactly what the consumer test
          # needs. The earlier runner.temp / env approach failed because GitHub's uses-resolver only
          # accepts github and actions/@ref in uses: paths.
          rm -rf ./.git
          cp -R "$consumer/." ./
          git init -q
          # Origin is already at $remote (copied from the fixture's .git), so this just re-confirms
          # the URL; add is a no-op fallback if the tree was freshly init'd instead.
          git remote set-url origin "file://$remote" || git remote add origin "file://$remote"
          git config user.email fixture@test
          git config user.name fixture
          git fetch -q origin
          # Stay on the fixture's own pr-head rather than resetting it to a fetched ref. The
          # obvious-looking `checkout -B pr-head FETCH_HEAD` points the branch at origin/main,
          # which is the *initial* commit -- the fixture's second commit is deliberately never
          # pushed, that is what makes it a pull request's head -- so it threw away the one change
          # this fixture exists to carry. The gate then saw an empty diff, honestly reported
          # PASSED, and the assertion below failed with "reported PASSED on a change that made a
          # method complex": a correct assertion firing on a broken fixture, which is why this
          # workflow read as a Windows problem while failing on every platform.
          git checkout -q pr-head
          echo "working tree is the fixture:"
          git log --oneline -3
          echo "the change under test, HEAD against origin/main:"
          git log --oneline origin/main..HEAD
          ls

      - name: Run the action in the fixture repository
        id: gate
        uses: ./
        with:
          # The CLI is installed to $RUNNER_TEMP/cli/source/java-metrics-cli/build/install/... by the
          # Build the CLI step. The module segment is part of the path: installDist is a task of the
          # java-metrics-cli subproject, so its output is never the root build/install. runner.temp is
          # available in with: values (it is the github context's runner.temp), whereas
          # github.workspace points at the swapped fixture workspace and would be wrong here.
          cli-path: ${{ runner.temp }}/cli/source/java-metrics-cli/build/install/java-metrics-cli/bin/java-metrics-cli
          policy: maintainability
          enforcement: enforce
          report-format: json
          report-path: metrics-gate-report.json
        # The verdict is asserted below rather than allowed to fail the step here, so the assertion
        # can read the outputs and explain what went wrong.
        continue-on-error: true

      - name: Assert the action behaved as a consumer expects
        run: |
          set -euo pipefail
          echo "status: ${{ steps.gate.outputs.status }}"
          echo "exit-code: ${{ steps.gate.outputs.exit-code }}"
          echo "blocking-count: ${{ steps.gate.outputs.blocking-count }}"
          echo "tool-version: ${{ steps.gate.outputs.tool-version }}"

          # The action runs in the runner's working directory, so its outputs name files relative to
          # it. A run that could not find the fixture would report a clean scan, which is the one
          # outcome this workflow exists to rule out.
          if [ "${{ steps.gate.outputs.status }}" = "PASSED" ]; then
            echo "::error::The action reported PASSED on a change that made a method complex."
            exit 1
          fi
          if [ "${{ steps.gate.outputs.exit-code }}" != "1" ]; then
            echo "::error::Expected exit code 1 for a violation, got ${{ steps.gate.outputs.exit-code }}."
            exit 1
          fi
          if [ "${{ steps.gate.outputs.blocking-count }}" = "0" ]; then
            echo "::error::A failing gate published zero blocking findings."
            exit 1
          fi
          if [ -z "${{ steps.gate.outputs.tool-version }}" ]; then
            echo "::error::The action published no tool version."
            exit 1
          fi
          # Completeness is what separates "the gate proved this change is fine" from "the gate
          # read part of the tree and found nothing in it". A consumer that wires this output and
          # gets an empty string concludes the first, which is the wrong answer in the direction
          # that matters.
          if [ -z "${{ steps.gate.outputs.completeness }}" ]; then
            echo "::error::The action published no analysis completeness."
            exit 1
          fi
          echo "completeness: ${{ steps.gate.outputs.completeness }}"
          # The aliases must agree with the counts they alias, or a consumer reading one and
          # another reading the other is working from two different accounts of one run.
          if [ "${{ steps.gate.outputs.total-count }}" != "${{ steps.gate.outputs.findings-count }}" ]; then
            echo "::error::total-count and findings-count disagree."
            exit 1
          fi
          if [ "${{ steps.gate.outputs.blocking-count }}" != "${{ steps.gate.outputs.violations-count }}" ]; then
            echo "::error::blocking-count and violations-count disagree."
            exit 1
          fi

      - name: Is there a release to download?
        id: release
        # Not `release: published`. The release workflow publishes with the default GITHUB_TOKEN, and
        # GitHub does not start a run from an event a GITHUB_TOKEN produced -- that is how it
        # prevents recursion, and it makes the release event silent for exactly the release this step
        # wants to test. So the question is asked instead: a version named by hand is taken as given,
        # and otherwise the API is asked whether any release exists.
        #
        # Only existence is read here. Which release `latest` means is left to the action, so this
        # step cannot disagree with it about that.
        env:
          # Authenticated. The unauthenticated rate limit is per IP address and hosted runners share
          # theirs, so an unauthenticated probe would report "no release" under load -- a wrong
          # answer in the direction that silently removes coverage.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_VERSION:-}" ]; then
            echo "Release named by the caller: $RELEASE_VERSION"
            echo "found=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
                 -H "Accept: application/vnd.github+json" \
                 -H "Authorization: Bearer $GH_TOKEN" \
                 "https://api.github.com/repos/${{ github.repository }}/releases/latest")
          # 404 is the one answer that means "there is nothing to test". Every other non-200 means
          # the question could not be asked -- an absent or rejected token, a rate limit, an outage
          # -- and reporting that as "no release" would quietly drop the only coverage the download
          # path has. A probe that cannot tell "nothing is there" from "I could not look" is worse
          # than no probe, so it fails instead.
          case "$code" in
            200)
              echo "found=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "No published release to download (the API answered 404)."
              echo "The download path is not exercised by this run, and that is not a failure."
              echo "found=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Could not ask whether a release exists; the API answered $code."
              exit 1
              ;;
          esac

      - name: Run the action again, letting it download the release
        id: download
        # The one thing the run above cannot prove. Nothing else in this job reaches the download,
        # the checksum verification or the unzip: `cli-path` is set there, and it short-circuits all
        # three before either of them is looked at.
        #
        # It runs against the same fixture deliberately. Two CLIs -- one built from this commit, one
        # downloaded from a release -- analysing one repository have to reach one verdict, and a
        # disagreement between them is the defect this step exists to catch. Asserting only that the
        # download succeeded would not notice a released archive that behaves unlike the code it was
        # built from.
        if: ${{ steps.release.outputs.found == 'true' }}
        uses: ./
        with:
          tool-version: ${{ env.RELEASE_VERSION || 'latest' }}
          policy: maintainability
          enforcement: enforce
          report-format: json
          report-path: metrics-gate-report-downloaded.json
        continue-on-error: true

      - name: The downloaded release and the local build agree
        if: ${{ steps.release.outputs.found == 'true' }}
        run: |
          set -euo pipefail
          echo "downloaded tool-version: ${{ steps.download.outputs.tool-version }}"
          echo "local tool-version:      ${{ steps.gate.outputs.tool-version }}"

          # A run that never reached the CLI publishes nothing. Reading that as "no findings" is the
          # confusion this whole workflow exists to prevent.
          if [ -z "${{ steps.download.outputs.status }}" ]; then
            echo "::error::The download run published no status, so the downloaded CLI never ran."
            exit 1
          fi
          if [ -z "${{ steps.download.outputs.tool-version }}" ] \
             || [ "${{ steps.download.outputs.tool-version }}" = "unknown" ]; then
            echo "::error::The download run published no tool version, so it read no report."
            exit 1
          fi

          # The released archive reports the version it was stamped with. Anything else means the
          # download resolved a release other than the one the caller named.
          if [ -n "${RELEASE_VERSION:-}" ]; then
            expected="${RELEASE_VERSION#v}"
            if [ "${{ steps.download.outputs.tool-version }}" != "$expected" ]; then
              echo "::error::Asked for $RELEASE_VERSION, and the report was written by ${{ steps.download.outputs.tool-version }}."
              exit 1
            fi
          fi

          compare() {
            if [ "$2" != "$3" ]; then
              echo "::error::$1: the released CLI reported '$2' where the locally built CLI reported '$3', on the same fixture."
              exit 1
            fi
          }
          compare status         "${{ steps.download.outputs.status }}"         "${{ steps.gate.outputs.status }}"
          compare exit-code      "${{ steps.download.outputs.exit-code }}"      "${{ steps.gate.outputs.exit-code }}"
          compare blocking-count "${{ steps.download.outputs.blocking-count }}" "${{ steps.gate.outputs.blocking-count }}"
          compare total-count    "${{ steps.download.outputs.total-count }}"    "${{ steps.gate.outputs.total-count }}"
          compare completeness   "${{ steps.download.outputs.completeness }}"   "${{ steps.gate.outputs.completeness }}"
          echo "The released archive and the locally built CLI agree on the same fixture."

      - name: Upload the consumer run's reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: action-consumer-${{ matrix.os }}
          path: |
            metrics-gate-report.json
            metrics-gate-report-downloaded.json
            ${{ runner.temp }}/metrics-findings.json
          if-no-files-found: warn
